# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# CONFIG_ZMK_SLEEP=y
CONFIG_PM_DEVICE=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# USB
CONFIG_USB_DEVICE_VID=0x05ac
CONFIG_USB_DEVICE_PID=0x0267
CONFIG_USB_DEVICE_MANUFACTURER="Apple Inc."
CONFIG_USB_DEVICE_PRODUCT="Aluminum Mini Keyboard (ISO)"

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Note: display-shield settings (prospector_adapter / dongle_screen) are
# per-target and live in build.yaml cmake-args, because these symbols are only
# defined when a display shield is selected. This shared file must stay
# board/display-neutral so it applies cleanly to every target (peripherals,
# settings_reset, and the non-display yj17120 dongle).
